name: BLS NFP Vintage Ingestion

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mujifx
    env:
      VERCEL_CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_VINTAGE_URL: https://muji-fx-fundamental-analyst.vercel.app/api/sync/authoritative-vintage
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mujifx/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download, parse and publish latest BLS NFP vintage
        run: node scripts/ingest-bls-nfp-vintage.mjs
