name: One-time BLS NFP Vintage Backfill

on:
  push:
    paths:
      - "mujifx/scripts/backfill-bls-nfp-vintage.mjs"

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mujifx
    env:
      VERCEL_CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_VINTAGE_URL: https://muji-fx-fundamental-analyst.vercel.app/api/sync/authoritative-vintage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mujifx/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: node scripts/backfill-bls-nfp-vintage.mjs
